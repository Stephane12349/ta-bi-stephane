<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Adjamé Market — Marketplace B2B Grossistes & Revendeurs Côte d'Ivoire</title>
    <meta name="description" content="Plateforme B2B connectant les grossistes d'Adjamé (Forum, Black Market, Gouro, Roxy) aux revendeurs et commerçants d'Abidjan et de l'intérieur." />
    <meta name="theme-color" content="#1B4D3E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #1B4D3E;
        --color-primary-light: #2C6E59;
        --color-primary-container: #E8F5E9;
        --color-secondary: #E67E22;
        --color-accent: #F1C40F;
        --color-whatsapp: #25D366;
        --color-bg: #F8F9FA;
        --color-surface: #FFFFFF;
        --color-text: #1C2833;
        --color-text-muted: #7F8C8D;
        --color-border: #E5E8E8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        line-height: 1.5;
        overflow-x: hidden;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      input, select, textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
